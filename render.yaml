services:
  - type: web
    name: freitty-api
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npx prisma db seed && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: DEMO_NOW
        value: 2026-04-17T12:00:00.000Z
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: freitty-db
          property: connectionString

databases:
  - name: freitty-db
    plan: free
    postgresMajorVersion: '16'
