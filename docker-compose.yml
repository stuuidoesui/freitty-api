services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: freitty
      POSTGRES_PASSWORD: freitty
      POSTGRES_DB: freitty
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U freitty -d freitty']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
